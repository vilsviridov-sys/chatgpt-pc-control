<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e1b">

<title>ChatGPT PC Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080e1b;
    color: #edf2ff;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    background: #111c30;
    border-bottom: 1px solid #293956;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin: 7px 0 0;
    color: #91a1bf;
    font-size: 13px;
}

main {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 15px;
}

.panel {
    background: #111c30;
    border: 1px solid #293956;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}

h2 {
    margin: 0 0 13px;
    font-size: 18px;
}

#chat {
    height: 55vh;
    min-height: 300px;
    max-height: 600px;

    overflow-y: auto;

    background: #091323;
    border-radius: 11px;

    padding: 12px;
    margin-bottom: 12px;
}

.message {
    padding: 12px;
    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.assistant {
    background: #1a2940;
    margin-right: 25px;
}

.user {
    background: #263b61;
    margin-left: 25px;
}

input {
    width: 100%;

    padding: 14px;

    background: #091323;
    color: white;

    border: 1px solid #354766;
    border-radius: 10px;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #6482ff;
}

button {
    border: 0;
    border-radius: 10px;

    padding: 13px 17px;

    background: #6482ff;
    color: white;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.secondary {
    background: #263650;
}

.row {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 11px;
}

.row button {
    flex: 1;
    min-width: 140px;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;

    color: #a9bad6;
    font-size: 13px;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;
    background: #39d99b;
}

.info {
    margin-top: 12px;

    color: #91a1bf;
    font-size: 13px;
    line-height: 1.6;
}

#controlStatus {
    min-height: 20px;
}

footer {
    padding: 20px;

    text-align: center;

    color: #687b9b;
    font-size: 12px;
}

@media (max-width: 450px) {

    header h1 {
        font-size: 20px;
    }

    #chat {
        height: 52vh;
    }

    .row button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>ChatGPT PC Control</h1>
    <p>Помощник для управления планшетом</p>
</header>

<main>

    <section class="panel">

        <h2>Состояние планшета</h2>

        <div class="status">
            <span class="status-dot" id="connectionDot"></span>
            <span id="connectionStatus">Подключение проверяется</span>
        </div>

        <div
            id="deviceStatus"
            class="info">
        </div>

    </section>


    <section class="panel">

        <h2>Помощник</h2>

        <div id="chat">

            <div class="message assistant">
                Привет! Я помощник ChatGPT PC Control.

                Я могу выполнять доступные команды управления планшетом.

                Напиши «помощь», чтобы посмотреть команды.
            </div>

        </div>


        <input
            id="messageInput"
            type="text"
            placeholder="Введите команду..."
            autocomplete="off"
        >


        <div class="row">

            <button id="sendButton">
                Отправить
            </button>

            <button
                id="clearButton"
                class="secondary">
                Очистить чат
            </button>

        </div>

    </section>


    <section class="panel">

        <h2>Управление планшетом</h2>

        <div class="row">

            <button id="fullscreenButton">
                Полный экран
            </button>

            <button
                id="wakeButton"
                class="secondary">
                Не выключать экран
            </button>

        </div>

        <p
            id="controlStatus"
            class="info">
        </p>

    </section>

</main>


<footer>
    ChatGPT PC Control
</footer>


<script>
"use strict";


const $ = id => document.getElementById(id);


let wakeLock = null;


/* --------------------------------
   ЧАТ
-------------------------------- */

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    $("chat").appendChild(message);

    $("chat").scrollTop = $("chat").scrollHeight;
}


/* --------------------------------
   ОТПРАВКА КОМАНДЫ
-------------------------------- */

function sendMessage() {

    const input = $("messageInput");

    const text = input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";

    addMessage(text, "user");

    const response = processCommand(text);

    addMessage(response, "assistant");
}


$("sendButton").addEventListener(
    "click",
    sendMessage
);


$("messageInput").addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


/* --------------------------------
   ОЧИСТКА ЧАТА
-------------------------------- */

$("clearButton").addEventListener(
    "click",
    () => {

        $("chat").replaceChildren();

    }
);


/* --------------------------------
   КОМАНДЫ ПОМОЩНИКА
-------------------------------- */

function processCommand(text) {

    const command =
        text.toLowerCase().trim();


    if (
        command === "привет" ||
        command === "здравствуй"
    ) {

        return "Привет! Готов к работе.";

    }


    if (
        command === "помощь" ||
        command === "команды"
    ) {

        return [
            "Доступные команды:",
            "",
            "время",
            "дата",
            "информация",
            "полный экран",
            "не выключай экран",
            "открой google",
            "открой youtube"
        ].join("\n");

    }


    if (command.includes("время")) {

        return (
            "Сейчас " +
            new Date().toLocaleTimeString("ru-RU")
        );

    }


    if (command.includes("дата")) {

        return (
            "Сегодня " +
            new Date().toLocaleDateString("ru-RU")
        );

    }


    if (
        command.includes("информация") ||
        command.includes("сведения")
    ) {

        updateDeviceInfo();

        return "Информация о планшете обновлена.";

    }


    if (
        command.includes("полный экран") ||
        command.includes("на весь экран")
    ) {

        enableFullscreen();

        return "Включаю полноэкранный режим.";

    }


    if (
        command.includes("не выключай экран") ||
        command.includes("не гаси экран")
    ) {

        requestWakeLock();

        return "Включаю режим удержания экрана.";

    }


    if (command.includes("открой google")) {

        openWebsite(
            "https://www.google.com"
        );

        return "Открываю Google.";

    }


    if (command.includes("открой youtube")) {

        openWebsite(
            "https://www.youtube.com"
        );

        return "Открываю YouTube.";

    }


    return "Команда не распознана.";
}


/* --------------------------------
   ОТКРЫТИЕ САЙТОВ
-------------------------------- */

function openWebsite(url) {

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* --------------------------------
   ПОЛНЫЙ ЭКРАН
-------------------------------- */

async function enableFullscreen() {

    if (document.fullscreenElement) {
        return;
    }

    try {

        await document.documentElement.requestFullscreen();

        $("controlStatus").textContent =
            "Полноэкранный режим включён.";

    } catch {

        $("controlStatus").textContent = "";

    }

}


/* --------------------------------
   НЕ ВЫКЛЮЧАТЬ ЭКРАН
-------------------------------- */

async function requestWakeLock() {

    if (!("wakeLock" in navigator)) {

        $("controlStatus").textContent = "";

        return;

    }


    try {

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

        $("controlStatus").textContent = "";

    } catch {

        $("controlStatus").textContent = "";

    }

}


/* --------------------------------
   ИНФОРМАЦИЯ ОБ УСТРОЙСТВЕ
-------------------------------- */

async function updateDeviceInfo() {

    const information = [];


    information.push(
        "Платформа: " +
        (navigator.platform || "неизвестно")
    );


    information.push(
        "Язык: " +
        navigator.language
    );


    information.push(
        "Интернет: " +
        (
            navigator.onLine
                ? "подключён"
                : "отсутствует"
        )
    );


    if (navigator.getBattery) {

        try {

            const battery =
                await navigator.getBattery();


            information.push(
                "Батарея: " +
                Math.round(
                    battery.level * 100
                ) +
                "%"
            );


            information.push(
                "Зарядка: " +
                (
                    battery.charging
                        ? "да"
                        : "нет"
                )
            );

        } catch {

            /* Ничего не показываем */

        }

    }


    $("deviceStatus").textContent =
        information.join("\n");

}


/* --------------------------------
   СОСТОЯНИЕ ИНТЕРНЕТА
-------------------------------- */

function updateConnectionStatus() {

    const online = navigator.onLine;


    $("connectionStatus").textContent =
        online
            ? "Интернет подключён"
            : "Нет подключения к интернету";


    $("connectionDot").style.background =
        online
            ? "#39d99b"
            : "#ff687d";

}


window.addEventListener(
    "online",
    updateConnectionStatus
);


window.addEventListener(
    "offline",
    updateConnectionStatus
);


/* --------------------------------
   ВОЗВРАТ К WAKE LOCK
-------------------------------- */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState === "visible" &&
            wakeLock &&
            wakeLock.released
        ) {

            try {

                wakeLock =
                    await navigator.wakeLock.request(
                        "screen"
                    );

            } catch {

                wakeLock = null;

            }

        }

    }
);


/* --------------------------------
   ЗАПУСК
-------------------------------- */

updateConnectionStatus();

updateDeviceInfo();

</script>

</body>
  </html>
