<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e1b">

<title>ChatGPT PC Control</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080e1b;
    color: #edf2ff;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    background: #111c30;
    border-bottom: 1px solid #293956;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin: 7px 0 0;
    color: #91a1bf;
    font-size: 13px;
}

main {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.panel {
    background: #111c30;
    border: 1px solid #293956;
    border-radius: 14px;
    padding: 16px;
}

#chat {
    height: 65vh;
    min-height: 350px;
    max-height: 700px;

    overflow-y: auto;

    background: #091323;
    border-radius: 11px;

    padding: 14px;
    margin-bottom: 12px;
}

.message {
    padding: 12px;
    margin-bottom: 10px;

    border-radius: 10px;

    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.assistant {
    background: #1a2940;
    margin-right: 25px;
}

.user {
    background: #263b61;
    margin-left: 25px;
}

.input-area {
    display: flex;
    gap: 9px;
}

#messageInput {
    flex: 1;

    min-width: 0;

    padding: 14px;

    background: #091323;
    color: white;

    border: 1px solid #354766;
    border-radius: 10px;

    font-size: 16px;
    outline: none;
}

#messageInput:focus {
    border-color: #6482ff;
}

button {
    border: 0;
    border-radius: 10px;

    padding: 13px 18px;

    background: #6482ff;
    color: white;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

.status {
    margin-top: 10px;

    color: #91a1bf;
    font-size: 13px;
}

.status-dot {
    display: inline-block;

    width: 8px;
    height: 8px;

    margin-right: 6px;

    border-radius: 50%;
    background: #f0ad4e;
}

footer {
    padding: 20px;

    text-align: center;

    color: #687b9b;
    font-size: 12px;
}

@media (max-width: 600px) {

    .input-area {
        flex-direction: column;
    }

    #messageInput {
        width: 100%;
    }

    #sendButton {
        width: 100%;
    }

    #chat {
        height: 60vh;
    }
}
</style>
</head>

<body>

<header>
    <h1>ChatGPT PC Control</h1>
    <p>Интерфейс управления планшетом через ИИ</p>
</header>


<main>

    <section class="panel">

        <div id="chat">

            <div class="message assistant">
                Подключение к ИИ пока не настроено.
            </div>

        </div>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Напишите сообщение..."
                autocomplete="off"
            >

            <button id="sendButton">
                Отправить
            </button>

        </div>


        <div class="status">
            <span
                class="status-dot"
                id="statusDot">
            </span>

            <span id="statusText">
                ИИ не подключён
            </span>
        </div>

    </section>

</main>


<footer>
    ChatGPT PC Control
</footer>


<script>
"use strict";


const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const chat =
    document.getElementById("chat");


function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }


    /*
     * Здесь НЕ происходит локальная
     * обработка команд.
     *
     * Сообщение должно передаваться
     * подключённой модели ИИ.
     */

    addMessage(
        text,
        "user"
    );


    messageInput.value = "";


    /*
     * Подключение ИИ будет добавлено
     * следующим этапом.
     */

}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
